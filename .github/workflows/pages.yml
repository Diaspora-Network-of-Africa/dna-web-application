# Deploys every branch to Cloudflare Pages as its own preview (branch name = preview alias);
# the production branch deploys to production. Direct-upload flow, so no GitHub App is needed.
# Required repository secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      # Ruling 1141: this deployment's own URL, never the branch alias. The step after the deploy
      # says why, and fails the job by name when there is none.
      url: ${{ steps.deploy.outputs.deployment-url }}
      deployed: ${{ steps.deploy.outcome == 'success' }}
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration lint below measures this change against its merge base with the default
          # branch, so the job needs the history, not just the tip.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Ruling 217: the registry is a third party this job does not test. A blip there used to be
      # indistinguishable from a broken lockfile.
      - run: scripts/retry.sh 3 bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit -p tsconfig.json
      # Ruling 387: the two contact modules agree, and no company email literal is anywhere else.
      - name: Contact constants parity and the no-literal scan (ruling 387)
        run: ARMS=parity,scan node tests/contact.cjs
      # Ruling 485, Fix PR 03 item 9: the token check was reachable only by dispatching the
      # responsive matrix, so on a push nothing ran it. A guardrail the harness enforces beats one
      # that is asserted, which is the lesson ruling 539 was built on. Static, no deployment needed.
      - name: Every cited token resolves in both themes (ruling 485)
        run: node scripts/token-check.mjs
      # Handoff 40-D arms 1 and 2 (Strand compile v1790885781186000, rulings 1309, 1310): the seven
      # admin parts load from the barrel and render in every state through the SSR renderer, none
      # branches on theme, and hasNumber answers 1301's four cases. Static: no page binds the parts
      # yet, so no deployment carries them for a mount arm to open. Their tokens are the step above.
      - name: The Strand admin parts render, and hasNumber reads a number (handoff 40-D)
        run: node tests/strand-admin.cjs
      # Handoff H61-SP (Strand compile sha256-b1a458dac1bd562f, brief 60-SP items 1 to 21, 1728): one
      # focused check per new behaviour the port carries for the parts no page binds yet (fixedStep's
      # bounds at 16:9 and 21:9, a profile with no stored framing, a controlled Tooltip on touch, the
      # new parts' landmarks). Static, as the arm above.
      - name: The Strand parts of brief 60-SP render, and fixedStep holds its bounds (handoff H61-SP)
        run: node tests/strand-parts.cjs
      # Handoff 45-C arm 4 (1378): admin-dia-note's SYSTEM places Direction, Depth and Source in
      # Mobilization and calls no joined member new, and BLOCKS is unchanged. Static.
      - name: DIA's Overview prompt, and its off switch (handoffs 45-C and 45-D, rulings 1378 and 1391)
        run: ARMS=prompt,off node tests/admin-dia-note.cjs
      # Ruling 547, Fix PR 03 item 6: every kind in the notification registry resolves to a
      # destination, and the kinds whose destination has no surface are named rather than exempted.
      - name: Every notification kind resolves to a destination (rulings 485, 547)
        run: node tests/notifications.cjs
      # W91 (Fix PR 10 item 6): the Messenger's avatar cache signs again past its margin and after a
      # dropped entry, read from the module with its imports stubbed. Static.
      - name: The avatar cache re-signs past its margin (W91)
        run: node tests/avatar-cache.cjs
      # Ruling 466, Fix PR 03 item 10: no migration file is amended after it is applied. Keyed on the
      # version and not the path, so the G17 baseline PR's directory move passes without editing it.
      - name: No applied migration file was amended (ruling 466)
        run: node tests/migration-lint.cjs
      - run: bun run build
      # Handoff 40-B section 6, arm 4: the member app's bundle carries no admin read and no admin
      # copy (Brief 12 guardrail 1). Read from the output this job just built.
      - name: The member bundle carries nothing admin (handoff 40-B)
        run: node tests/admin-bundles.cjs member
      - name: Cloudflare secrets missing
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: echo "::notice::Deploy skipped. Add CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable per-branch Pages previews."
      # Genuinely idempotent (ruling 147): the script asks whether the project exists before
      # creating it, and treats "already exists" (code 8000002) as the steady state rather than an
      # error. One script for this project and for dna-admin (handoff 40-B section 2).
      - name: Ensure the Pages project exists
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        env:
          PROJECT: dna-web-application
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/ensure-pages-project.sh
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dna-web-application --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true
      # Ruling 1141 (G126). The live and matrix jobs, and ruling 217's gate inside them, read the
      # deployment this run uploaded at its own URL, https://<id>.dna-web-application.pages.dev, and
      # never the branch alias. The alias is a pointer Cloudflare moves between deployments, so a
      # reading of it is not tied to this upload, and on run 361 it answered 404 on every route for
      # about ninety minutes, across two deployments of one build, then cleared with nothing done.
      # With no URL the job fails here, by name. Nothing downstream builds a host from the branch
      # name, which is not even a valid host for a branch carrying a slash.
      - name: The deployment's own URL (ruling 1141)
        if: ${{ steps.deploy.outcome == 'success' }}
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |
          set -uo pipefail
          if [ -z "$URL" ]; then
            echo "::error::The deploy step returned no deployment-url, so no job has a deployment to test. No host is built from the branch name (ruling 1141)."
            exit 1
          fi
          if [ "$URL" = "$ALIAS" ]; then
            echo "::error::The deploy step's deployment-url is the branch alias, $ALIAS, and not the deployment's own URL (ruling 1141)."
            exit 1
          fi
          echo "Deployment ${ID:-(no id returned)} at $URL. The test jobs read this URL; the branch alias, ${ALIAS:-none returned}, is read by no job."

  # Handoff 40-B section 2 (Brief 12 12A-2, rulings 1290, 1291): the admin app, built from admin/
  # and uploaded to its own Pages project, dna-admin, which the founder attaches to
  # admin.diasporanetwork.africa. The member job's steps, one for one, against the admin build and
  # project. Its own job with no `needs` in either direction, so it neither delays nor gates the
  # member app's deploy, and the member app's test jobs never wait on it.
  deploy-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      # Ruling 1141, as in the member job: this deployment's own URL, never the branch alias.
      url: ${{ steps.deploy.outputs.deployment-url }}
      deployed: ${{ steps.deploy.outcome == 'success' }}
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: scripts/retry.sh 3 bun install --frozen-lockfile
      # `bun run lint` in the member job already covers admin/ (eslint runs on the whole tree); the
      # admin tree's types are its own project.
      - run: bunx tsc --noEmit -p admin/tsconfig.json
      - run: bun run build:admin
      # Handoff 40-B section 6, arm 4: the admin bundle carries no member route.
      - name: The admin bundle carries no member route (handoff 40-B)
        run: node tests/admin-bundles.cjs admin
      - name: Cloudflare secrets missing
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: echo "::notice::Admin deploy skipped. Add CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable per-branch Pages previews."
      - name: Ensure the Pages project exists
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        env:
          PROJECT: dna-admin
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/ensure-pages-project.sh
      - name: Deploy to Cloudflare Pages (dna-admin)
        id: deploy
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy admin/dist --project-name=dna-admin --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: The admin deployment's own URL (ruling 1141)
        if: ${{ steps.deploy.outcome == 'success' }}
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |
          set -uo pipefail
          if [ -z "$URL" ]; then
            echo "::error::The admin deploy step returned no deployment-url, so the admin arms have no deployment to test. No host is built from the branch name (ruling 1141)."
            exit 1
          fi
          if [ "$URL" = "$ALIAS" ]; then
            echo "::error::The admin deploy step's deployment-url is the branch alias, $ALIAS, and not the deployment's own URL (ruling 1141)."
            exit 1
          fi
          echo "Admin deployment ${ID:-(no id returned)} at $URL. The admin arms read this URL; the branch alias, ${ALIAS:-none returned}, is read by no job."
          {
            echo "### Admin deployment (handoff 40-B)"
            echo ""
            echo "dna-admin at \`$URL\`, built from \`${{ github.sha }}\`. Alias: \`${ALIAS:-none}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Handoff 40-B section 6: the admin arms, against the dna-admin deployment this run uploaded.
  # Chromium on the runner; the founder's device check (61) covers Safari until a design lands.
  admin-arms:
    needs: deploy-admin
    if: ${{ needs.deploy-admin.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_BASE: ${{ needs.deploy-admin.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: The host this job tests (ruling 1141)
        env:
          BASE: ${{ needs.deploy-admin.outputs.url }}
          KIND: push
        run: scripts/host-tested.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: scripts/retry.sh 3 bun install --frozen-lockfile
      - name: The admin deployment serves every path the arms open (ruling 217)
        env:
          BASE: ${{ needs.deploy-admin.outputs.url }}
          APP: admin
        run: scripts/deployment-serves.sh
      # Handoff 45-C arm 5 (1379): admin-dia-note's CORS answers the host this run's deploy-admin
      # job reported, and refuses an arbitrary pages.dev origin.
      - name: admin-dia-note answers this admin deployment's origin (handoff 45-C, ruling 1379)
        env:
          ADMIN_BASE: ${{ needs.deploy-admin.outputs.url }}
        run: ARMS=origin node tests/admin-dia-note.cjs
      - name: Install Chromium
        run: scripts/retry.sh 3 bunx playwright install --with-deps chromium
      - name: Run the admin arms (chromium)
        env:
          ENGINE: chromium
          SPECIAL: admin
          OUT: ${{ github.workspace }}/matrix-out
          # The two seeded accounts the live job already signs in (ruling 218); without them arms 2
          # and 3 report unproven (ruling 228), which is what a fork PR gets.
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          MEMBER_EMAIL: ${{ secrets.MEMBER_EMAIL }}
          MEMBER_PASSWORD: ${{ secrets.MEMBER_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          node tests/matrix.cjs 2>&1 | tee "$OUT/matrix.log"
      - name: Arms, in the tail (rulings 267, 292)
        if: always()
        env:
          OUT: ${{ github.workspace }}/matrix-out
        run: |
          set -uo pipefail
          log="$OUT/matrix.log"
          if [ ! -s "$log" ]; then
            echo "The admin arms step produced no output; it did not reach tests/matrix.cjs."
            exit 0
          fi
          tail=$(sed -n '/=== arms by tier/,$p' "$log")
          [ -n "$tail" ] || tail=$(tail -80 "$log")
          {
            echo "### admin arms, chromium (handoff 40-B; ruling 292: arms, not a total)"
            echo '```'
            printf '%s\n' "$tail"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-arms-run-${{ github.run_number }}
          path: matrix-out
          if-no-files-found: warn

  # Ruling 218's arms, in their own job.
  #
  # Ruling 267: these arms used to run after the browser download, so reading them meant fetching a
  # 160 KB log to find them under about 1,200 lines of apt and CDN noise. On their own runner there
  # is no such noise, they report in about two minutes instead of after the full matrix, and they
  # are re-emitted at the end of the job besides. They gate nothing in the browser matrix: a REST
  # finding and a rendering finding are different questions and ruling 217 says a gate answers one.
  live:
    needs: deploy
    if: ${{ needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ruling 1141: the deployment this run uploaded, at its own URL. No fallback; the deploy job
      # fails by name when it has no URL, and this job does not run.
      BASE: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      # Ruling 1141 (811, 893): the host this job reads, in its log and its summary, before anything
      # reads it, so every reading here is tied to one deployment in the run itself.
      - name: The host this job tests (ruling 1141)
        env:
          KIND: push
        run: scripts/host-tested.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: scripts/retry.sh 3 bun install --frozen-lockfile
      - name: The deployment serves every path the suites open (ruling 217)
        run: scripts/deployment-serves.sh
      # Ruling 387: security.txt is asserted on the deployment, never on the local source, so the
      # arm proves the hosting path (text/plain, Contact, a future Expires).
      - name: security.txt on the deployment (ruling 387)
        run: ARMS=security node tests/contact.cjs
      # Ruling 218's arms are signed-in and need two seeded non-real accounts. Repository secrets
      # are not visible to a step unless the workflow passes them, so without this block the arms
      # skip and report unproven (ruling 228) however many secrets exist. A fork PR gets empty
      # strings here and the arms skip, which is the correct outcome rather than a failure.
      - name: Brief 3 and Brief 4 live checks (served HTML, the anonymous REST surface, the signed-in arms)
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          MEMBER_EMAIL: ${{ secrets.MEMBER_EMAIL }}
          MEMBER_PASSWORD: ${{ secrets.MEMBER_PASSWORD }}
          # Ruling 382: one database secret, a connection string for the live_arms role. The arms
          # inside the database (Hotfix 01, IB-18, 416, 435, 439, 442) run on it through one pg
          # client, each in a rolled-back transaction; without it they report unproven (ruling 228).
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
        run: |
          set -o pipefail
          mkdir -p live-out
          node tests/live-checks.cjs 2>&1 | tee live-out/live-checks.log
      # Ruling 444 (F25): the migration tree against supabase_migrations.schema_migrations, read
      # as live_arms. A version on one side only or a statement that differs from its file fails;
      # the two recorded rows with empty statements are reported by name and not repaired.
      - name: Migration drift (ruling 444)
        if: always()
        env:
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
        run: node tests/migration-drift.cjs
      # Ruling 1002: public.event_registrations is the truth for attendance and the event_rsvp edge
      # is derived from it inside private.rsvp_write, in the same transaction and never by a
      # trigger. private.rsvp_edge_drift() names every place the two disagree; this arm reads it as
      # live_arms and fails on any row. Before Chat applies 20260921120100 the function is not on
      # the project and the arm reports UNPROVEN (ruling 228), which is the reading on every branch
      # until then.
      - name: RSVP edge drift (ruling 1002)
        if: always()
        env:
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
        run: node tests/rsvp-drift.cjs
      # Ruling 267. `if: always()` because the arms are most worth reading in the tail on the run
      # where one of them failed, which is the run where the step above stopped early.
      - name: Live-check arms, re-emitted in the tail (ruling 267)
        if: always()
        run: |
          echo "=== tests/live-checks.cjs, re-emitted (ruling 267) ==="
          if [ -s live-out/live-checks.log ]; then
            cat live-out/live-checks.log
            {
              echo "### Live-check arms (ruling 218)"
              echo '```'
              cat live-out/live-checks.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The live-check step produced no output; it did not reach tests/live-checks.cjs."
          fi
      - name: Upload the live-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-checks-${{ github.run_number }}
          path: live-out
          if-no-files-found: warn

  # Exit check (ruling 61): the responsive matrix against the deployed preview.
  #
  # Rulings 223 and 283: one job per engine rather than one job driving both. Run 108 finished at
  # 38m16s of a 45-minute budget with both engines in one process, and ruling 283 records that the
  # next surface arm starts from 38 rather than 24, so Convene breaches the ceiling. The two engines
  # share no state, so splitting them halves the wall clock instead of deferring the breach, and it
  # buys two things raising the ceiling does not: a Chromium result that no longer waits on WebKit,
  # and, with fail-fast off, a Chromium result that a WebKit crash can no longer take down with it.
  # Under ruling 265 that is the difference between a red matrix and a red engine.
  matrix:
    needs: deploy
    if: ${{ needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    # Handoff 38-C (G196), superseding the 60 handoff 31-B set when run 316 put Chromium's whole
    # matrix past 45 at +2682s. The budget is the sum of what the job does, read on runs 436 and
    # 439 and stated per engine, because the two share no state (283).
    #
    # WebKit: setup through the deployment check, 15 s on run 436; the apt-archive cache restore
    # and seed, under 30 s; the install at its own 14-minute bound (the step below); the suite,
    # 52m31s on run 436 (390 arms, +3151s) and, at run 439 attempt 2's pace, 6 per cent slower
    # with a crash and its retry inside it (+3217s where run 436 read +3034s), about 56 minutes;
    # 1237's retries at the census's maximum of two crashed arms in one job (828, run 139), each a
    # fresh browser and the longest arm again, the connect arm at 23 s, under 2 minutes; the core
    # extraction, 2m01s on run 439 attempt 2, 3 minutes; the archive harvest, the classification and
    # the upload, under 1 minute. 0.5 + 0.5 + 14 + 56 + 2 + 3 + 1 = 77, so 85: an 8-minute margin.
    #
    # Chromium: the same setup, cache and install bound, 15; the suite, 51m16s on run 436 and
    # 50m19s on run 439, 52; no core step and no retry, because Chromium has not crashed once in the
    # census; the upload, under 1. 15 + 52 + 1 = 68, so 75: a 7-minute margin. Chromium's 60 is
    # raised on its own reading and not on WebKit's: its suite was 44m42s when 31-B set 60 and is
    # 51 now, which left 8 minutes for an install that run 439 showed cannot be assumed to take 26 s.
    timeout-minutes: ${{ matrix.engine == 'webkit' && 85 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      # Ruling 1141, as in the live job: the deployment this run uploaded, at its own URL.
      BASE: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      # Ruling 1141, as in the live job: each engine's summary names the host it tests.
      - name: The host this job tests (ruling 1141)
        env:
          KIND: push
        run: scripts/host-tested.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: scripts/retry.sh 3 bun install --frozen-lockfile
      - name: The deployment serves every path the suites open (ruling 217)
        run: scripts/deployment-serves.sh
      # The runner image ships a Google Chrome apt source the matrix never reads: browsers come
      # from Playwright. On 9 September its Packages index served a hash sum mismatch, apt-get
      # update inside --with-deps exited 100, and the matrix never started. Drop the source.
      - name: Drop the unused Google Chrome apt source
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
      # Handoff 38-C (G196), item 2: the apt archives, cached. Read on runs 436 and 439, the slow
      # part of the install is the apt archive fetch inside --with-deps and never the browser
      # download: cdn.playwright.dev served WebKit in 3 s on all three WebKit jobs, while the Ubuntu
      # mirror served the same 130 MB of packages in 9 s on run 436, in 31m47s on run 439 attempt 1
      # and in 7m50s on attempt 2. So the browser directory is not cached, 3 s is not worth a step,
      # and the .deb files are. Caching them is sound because apt, not the cache, decides what is
      # installed: every file already in /var/cache/apt/archives is checked against the signed index
      # and fetched again if it does not match, so a stale or partial set costs a fetch and never a
      # wrong package. What is not sound, and not done, is caching the installed files themselves
      # past dpkg. The key is the runner image (ImageOS and ImageVersion, which the runner exports
      # and the env context does not carry), the engine, and Playwright's resolved version from
      # node_modules, so the set moves with the image week and with the package list. The restore
      # prefix is the image OS and the engine only: a new image week, or a Playwright bump, restores
      # the most recent set saved for that engine and starts from it rather than from nothing, and
      # apt verifies it file by file, fetching what the new week's index names differently and
      # keeping the rest; the complete set is then saved under the new exact key. The cache action
      # takes the newest entry under a prefix, so a complete set outranks run 441's stranded partial
      # one wherever both match. The key is ordered OS, engine, image version, Playwright, so that
      # prefix is a prefix of it: run 444 read `Cache not found` for `apt-archives-ubuntu24-webkit-`
      # against run 443's `apt-archives-ubuntu24-20260927.320.1-webkit-...` because the version sat
      # between the two, and a fallback that can never match is the miss it was meant to prevent.
      # Restored into a runner-owned directory and copied in with sudo, because the cache action
      # cannot write apt's root-owned directory. A miss is exactly today: nothing is copied in, and
      # the step after the install keeps what apt fetched for the next run. The runner image writes
      # no docker-clean and leaves APT::Keep-Downloaded-Packages at its default, so the files are
      # there to keep; the step prints how many.
      - name: The cache key for the apt archives (handoff 38-C)
        id: apt-key
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -uo pipefail
          pw=$(node -p "require('playwright/package.json').version")
          image="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          # "-complete": only a set harvested after a successful install is saved under this key.
          # Run 441's first shape saved a 10-file set under the key without the suffix, and an
          # exact hit is never saved again, so that entry is left to expire unused.
          echo "key=apt-archives-${ImageOS:-unknown}-${ENGINE}-${ImageVersion:-unknown}-playwright-${pw}-complete" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-archives-${ImageOS:-unknown}-${ENGINE}-" >> "$GITHUB_OUTPUT"
          echo "Runner image ${image}, Playwright ${pw}, engine ${ENGINE}."
      - name: Restore the apt archives (handoff 38-C)
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}
      - name: Seed apt's archive directory from the cache (handoff 38-C)
        env:
          HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          debs=("$HOME"/.cache/apt-archives/*.deb)
          echo "apt archives restored from the cache: ${#debs[@]} files (exact key hit: ${HIT:-false})."
          if [ "${#debs[@]}" -gt 0 ]; then
            sudo cp -n "${debs[@]}" /var/cache/apt/archives/
          fi
      # Ruling 217: cdn.playwright.dev and apt are third parties this gate does not test, and a
      # failure here used to end the matrix before a test body ran. Retried, and only the engine
      # this job drives is downloaded, which halves both the transfer and the apt surface.
      #
      # Handoff 38-C (G196), item 1: the install has its own time, separate from the suite's. Run
      # 439's two attempts lost the Linux WebKit job to this step twice, at 32m10s and at 8m22s of
      # an install that takes 73 s (WebKit) and 26 s (Chromium) on run 436, and the job was cut at
      # its 60 minutes with no check failed, which is a gate the runner voids (217, 228). The runner
      # image's apt carries a 15-second stall timeout and one retry, which a mirror serving 67.9 kB/s
      # never trips. So each attempt is bounded at 240 s through scripts/retry.sh, 3.3 times the
      # healthy WebKit step: an attempt the mirror stalls ends and is retried, and the retry keeps
      # what the attempt fetched, because apt fetches only what its archive directory does not
      # already hold. Three timed-out attempts fail the job here, by name, at 3 × (240 + 20 s kill
      # grace) + 15 s of delays, 13m15s; the step's own 14-minute limit is the line that holds
      # whatever the shell does (485, 539).
      #
      # Each attempt first ends what the previous one left running as root. Playwright runs apt
      # through sudo, and sudo runs its command in a pty session of its own, outside the process
      # group timeout signals; on run 441 the bound cut attempt 1 at 240 s with the mirror at about
      # 60 kB/s, and its apt-get, pid 2687, outlived the attempt and held the dpkg frontend lock
      # through attempts 2 and 3, which failed in a second each. So the attempt kills apt-get, dpkg
      # and apt's fetch methods, TERM then KILL, then runs dpkg --configure -a, because a cut that
      # lands in the unpack window leaves dpkg interrupted and apt refuses to run until that is
      # finished, and only then installs. What the cut attempt fetched stays in apt's archive
      # directory and its partial files resume. The bound is proven by matrix.yml's
      # install_attempt_seconds probe, which forces a short one on a dispatch; nothing here changes it.
      - name: Install the browser this job drives
        id: install
        timeout-minutes: 14
        env:
          RETRY_ATTEMPT_SECONDS: "240"
          ENGINE: ${{ matrix.engine }}
        run: |
          scripts/retry.sh 3 bash -c '
            for sig in TERM KILL; do
              sudo pkill -"$sig" -x apt-get && sleep 3 || true
              sudo pkill -"$sig" -x dpkg || true
              sudo pkill -"$sig" -f "^/usr/lib/apt/methods/" || true
            done
            sudo dpkg --configure -a && exec bunx playwright install --with-deps "$ENGINE"
          '
      # Only a complete set is kept: a set harvested after a cut attempt (run 441 kept 10 of 195
      # files) would be saved under the exact key, and an exact hit is never saved again, so the
      # partial set would stand until the image or Playwright moved. With the install failed the
      # directory is never created, the cache action finds no path and saves nothing, and the next
      # run starts clean.
      - name: Keep the apt archives for the cache (handoff 38-C)
        if: ${{ always() && steps.install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true' }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          mkdir -p "$HOME/.cache/apt-archives"
          debs=(/var/cache/apt/archives/*.deb)
          if [ "${#debs[@]}" -gt 0 ]; then
            sudo cp "${debs[@]}" "$HOME/.cache/apt-archives/"
          fi
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-archives"
          echo "apt archives kept for the cache: ${#debs[@]} files, $(du -sh "$HOME/.cache/apt-archives" | cut -f1); the cache action saves them when this job ends."
      # Ruling 830. The loop harness in matrix.yml has captured cores, gdb frames and resolved
      # library offsets since ruling 200, and it is what named G5's fault site; the PR path captured
      # one log line. Ruling 828's census is the argument for moving it here: seventeen sightings in
      # eight days, all on this path, every one of which could have carried a stack and did not,
      # while the loop harness has to be dispatched deliberately and reproduces about one crash per
      # 210 iterations. WebKit only, because Chromium has not crashed once in the census and apt and
      # gdb are not worth a minute on the engine that does not need them. Diagnostic: no pass
      # criterion, and the step never fails the job.
      - name: Enable core dumps (rulings 200, 830)
        if: ${{ matrix.engine == 'webkit' }}
        run: |
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern='/tmp/cores/core.%e.%p.sig%s' || true
          sudo sysctl -w kernel.core_uses_pid=0 || true
          sudo sysctl -w fs.suid_dumpable=1 || true
          cat /proc/sys/kernel/core_pattern
      - name: Run the matrix (${{ matrix.engine }})
        env:
          ENGINE: ${{ matrix.engine }}
          OUT: ${{ github.workspace }}/matrix-out
          # Handoff 41-B section 5: the Messenger media arm (tests/messenger-media.cjs) signs the two
          # seeded accounts in for real against the deployment's own routes (ruling 218), as the live
          # job and the admin-arms job already do; without them the arm reports every check unproven
          # (ruling 228), which is what a fork PR gets. matrix.yml's dispatch has carried them since 40-B.
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          MEMBER_EMAIL: ${{ secrets.MEMBER_EMAIL }}
          MEMBER_PASSWORD: ${{ secrets.MEMBER_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          # Ruling 830: without this the kernel writes no core however the pattern is set. Harmless
          # on the Chromium job, which changes no core pattern and has never crashed.
          ulimit -c unlimited
          node tests/matrix.cjs 2>&1 | tee "$OUT/matrix.log"
      # Ruling 830, ported from matrix.yml's own step rather than written again, so the two paths
      # cannot drift in what they capture. Before the classification step and not after it: ruling
      # 267's defect was reintroduced once by putting this last, and on the one run where the
      # classification matters most, a run that lost a web process, up to 4000 lines of gdb frames
      # then buried the summary. That is matrix.yml's run 45.
      - name: Extract the signal and stack from any core (rulings 200, 830)
        if: ${{ always() && matrix.engine == 'webkit' }}
        # The step says of itself that it never fails the job, and on run 259 it did. An assertion
        # in a comment is not a guardrail (485, 539): this is the one line that makes the charter
        # true whatever any future edit to the shell below does.
        continue-on-error: true
        env:
          OUT: ${{ github.workspace }}/matrix-out
        run: |
          set -uo pipefail
          shopt -s nullglob
          cores=(/tmp/cores/core.*)
          echo "cores written: ${#cores[@]}"
          [ "${#cores[@]}" -eq 0 ] && exit 0
          # Ruling 850. continue-on-error is right under 217 and it also buys silence: this step can
          # now degrade three ways and every one of them is quiet. apt failing prints a ::notice::
          # that nobody reads in a job that went green; an unresolvable executable and a gdb run that
          # produces no frames each leave one line in an artefact nobody opens. The next PR-path
          # crash is the one that finally delivers frames and offsets, because run 259's step died
          # before gdb ran and run 260 had nothing to analyse, and a degradation that announces
          # nothing would lose exactly that crash without anyone knowing it was lost. So a degraded
          # extraction says so in the job summary, where the classification tail already reports.
          degraded() {
            echo "::warning::ruling 850: the core extraction degraded, $1"
            {
              echo "### ruling 850: a web process died and its stack was NOT extracted"
              echo ""
              echo "$1"
              echo ""
              echo "Nothing else in this run captures those frames. Where the core was retained it is"
              echo "in this job's artefact under \`cores/\`; where it was not, the crash is unrecoverable."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          # Ruling 217: diagnostic by charter, and apt and gdb are third parties it does not test.
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb elfutils || {
            degraded "gdb and elfutils could not be installed, so ${#cores[@]} core(s) are retained unanalysed."
            mkdir -p "$OUT/cores"
            for c in "${cores[@]}"; do cp "$c" "$OUT/cores/" 2>/dev/null || true; done
            exit 0
          }
          mkdir -p "$OUT/cores"
          for c in "${cores[@]}"; do
            name=$(basename "$c")
            echo "=== $name ===" | tee -a "$OUT/cores/stacks.txt"
            file "$c" | tee -a "$OUT/cores/stacks.txt"
            # `file` names the binary in execfn; that is the only reliable source here, because the
            # crashing thread's comm (ThreadedCompositor, truncated to 15 chars) is what %e records,
            # not the executable.
            # `|| true` is load-bearing, not tidiness. The runner's default shell is `bash -e`, so
            # -e is already on before this step's own `set -uo pipefail`, and grep exits 1 when it
            # matches nothing. A core `file` cannot read the notes of prints no `execfn:` at all, so
            # the pipeline exits 1, the assignment inherits it, and the step dies before gdb runs:
            # on run 259 the first real core on this path read "too many program headers (2054)" and
            # took the whole job red with it, which is exactly the diagnostic-fails-the-gate shape
            # this step's charter forbids. Empty is a legitimate answer here and reaches the
            # degraded path below, which retains the core for offline analysis.
            exe=$(file "$c" | grep -o "execfn: '[^']*'" | head -1 | sed "s/execfn: '//; s/'$//" || true)
            [ -n "$exe" ] || exe=$(file "$c" | grep -o "from '[^']*'" | head -1 | sed "s/from '//; s/'$//" | awk '{print $1}' || true)
            echo "exe: ${exe:-unknown}" | tee -a "$OUT/cores/stacks.txt"
            frames=0
            if [ -n "$exe" ] && [ -e "$exe" ]; then
              # info sharedlibrary is what makes the frames portable: the addresses mean nothing
              # without debug info, but library-relative offsets anchor to an exact build. `bt` on
              # the current thread first, because gdb positions itself on the faulting thread and
              # `thread apply all` prints in descending order, so a truncating head eats exactly the
              # frames worth having.
              gdb -batch -q -ex "set pagination off" -ex "info registers rip" \
                -ex "info sharedlibrary" -ex "echo \n=== FAULTING THREAD ===\n" -ex "bt 60" \
                -ex "echo \n=== ALL THREADS ===\n" -ex "thread apply all bt 25" \
                "$exe" --core "$c" 2>&1 |
                head -4000 | tee -a "$OUT/cores/gdb-$name.txt"
              cat "$OUT/cores/gdb-$name.txt" >> "$OUT/cores/stacks.txt"
              grep -qE '^#[0-9]+ ' "$OUT/cores/gdb-$name.txt" && frames=1
              if [ "$frames" -eq 1 ]; then
                wk=$(grep -o '/[^ ]*libWPEWebKit[^ ]*' "$OUT/cores/gdb-$name.txt" | head -1 || true)
                [ -n "$wk" ] && file "$wk" > "$OUT/cores/buildid-$name.txt" 2>/dev/null || true
                node scripts/frame-offsets.mjs "$OUT/cores/gdb-$name.txt" \
                  "$OUT/cores/buildid-$name.txt" > "$OUT/cores/offsets-$name.txt" 2>&1 || true
                sed -n '1,80p' "$OUT/cores/offsets-$name.txt"
                {
                  echo "### ruling 830: a web process died, and this is its stack"
                  echo '```'
                  sed -n '1,60p' "$OUT/cores/offsets-$name.txt"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "executable not resolvable" | tee -a "$OUT/cores/stacks.txt"
              degraded "the executable could not be resolved from \`file\` output for $name, so gdb was never run."
            fi
            # A web-process core runs to hundreds of megabytes, and an artifact that fails to upload
            # takes the stack down with it. Keep the core only when no frames came back.
            if [ "$frames" -eq 1 ]; then
              echo "frames extracted; core not retained ($(du -h "$c" | cut -f1))" | tee -a "$OUT/cores/stacks.txt"
            else
              echo "no frames; retaining core ($(du -h "$c" | cut -f1))" | tee -a "$OUT/cores/stacks.txt"
              degraded "gdb ran on $name but returned no frames."
              cp "$c" "$OUT/cores/" 2>/dev/null || {
                echo "core copy failed (size?)" | tee -a "$OUT/cores/stacks.txt"
                degraded "$name could not be copied into the artefact either, so it is lost with the runner."
              }
            fi
          done
          exit 0
      # Rulings 274 and 292 put the classification and the per-arm accounting at the end of the
      # suite's own output. Lifting that tail into the job summary means the result per tier, and
      # whether a failure sat behind a crash, is readable without opening the log at all.
      - name: Arms, tiers and the crash classification, in the tail (rulings 267, 274, 292)
        if: always()
        env:
          OUT: ${{ github.workspace }}/matrix-out
        run: |
          set -uo pipefail
          log="$OUT/matrix.log"
          if [ ! -s "$log" ]; then
            echo "The matrix step produced no output; it did not reach tests/matrix.cjs."
            exit 0
          fi
          tail=$(sed -n '/=== arms by tier/,$p' "$log")
          [ -n "$tail" ] || tail=$(tail -80 "$log")
          echo "=== ${{ matrix.engine }}: the matrix summary, re-emitted (ruling 267) ==="
          printf '%s\n' "$tail"
          {
            echo "### ${{ matrix.engine }} (ruling 292: arms, not a total)"
            echo '```'
            printf '%s\n' "$tail"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.engine }}-run-${{ github.run_number }}
          path: matrix-out
          if-no-files-found: warn
